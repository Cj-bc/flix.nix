name: Update flix version

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-flix:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35

      - name: Get latest flix release
        id: latest
        run: |
          tag=$(gh release view -R flix/flix --json tagName -q .tagName)
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "::error::Failed to resolve latest flix release tag"
            exit 1
          fi
          version="${tag#v}"
          attr="flix_$(awk -v v="$version" 'BEGIN { gsub(/\./, "_", v); print v }')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "attr=$attr" >> "$GITHUB_OUTPUT"

      - name: Check if already tracked
        id: check
        env:
          VERSION: ${{ steps.latest.outputs.version }}
        run: |
          if jq -e --arg v "$VERSION" 'has($v)' versions.json; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for existing pull request
        id: pr_check
        if: steps.check.outputs.new == 'true'
        env:
          VERSION: ${{ steps.latest.outputs.version }}
        run: |
          existing=$(gh pr list --head "update-flix-${VERSION}" --state open --json number --jq 'length')
          if [ "$existing" != "0" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve source hash
        id: hash
        if: steps.check.outputs.new == 'true' && steps.pr_check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.latest.outputs.version }}
        run: |
          hash=$(nix-prefetch-url "https://github.com/flix/flix/releases/download/v${VERSION}/flix.jar")
          if [ -z "$hash" ]; then
            echo "::error::Failed to resolve hash for flix ${VERSION}"
            exit 1
          fi
          echo "value=$hash" >> "$GITHUB_OUTPUT"

      - name: Insert new version
        if: steps.check.outputs.new == 'true' && steps.pr_check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.latest.outputs.version }}
          HASH: ${{ steps.hash.outputs.value }}
        run: |
          jq --arg v "$VERSION" --arg h "$HASH" \
            '. + {($v): $h} | .latest = $v' versions.json > versions.json.tmp
          mv versions.json.tmp versions.json

      - name: Verify build
        if: steps.check.outputs.new == 'true' && steps.pr_check.outputs.exists == 'false'
        env:
          ATTR: ${{ steps.latest.outputs.attr }}
        run: nix build ".#packages.x86_64-linux.${ATTR}" --no-link

      - name: Push branch
        if: steps.check.outputs.new == 'true' && steps.pr_check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.latest.outputs.version }}
        run: |
          branch="update-flix-${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add versions.json
          git commit -m "feat: add flix ${VERSION}"

          # A branch with this name but no open PR (checked in the previous
          # step) can only be a leftover from a previous run that failed
          # after pushing but before opening its pull request. Clear it so
          # this run isn't blocked by it.
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "::warning::Branch '${branch}' already exists on origin with no open pull request against it (leftover from a previous failed run). Deleting it before pushing."
            if ! git push origin --delete "$branch"; then
              echo "::error::Could not delete the stale remote branch '${branch}'. Delete it manually (git push origin --delete ${branch}) and re-run this workflow."
              exit 1
            fi
          fi

          if ! git push -u origin "$branch"; then
            echo "::error::Failed to push branch '${branch}' to origin."
            exit 1
          fi

      - name: Open pull request
        if: steps.check.outputs.new == 'true' && steps.pr_check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.latest.outputs.version }}
          ATTR: ${{ steps.latest.outputs.attr }}
        run: |
          branch="update-flix-${VERSION}"

          if gh pr create \
            --head "$branch" \
            --title "feat: add flix ${VERSION}" \
            --body "Adds \`${ATTR}\` (flix ${VERSION}) and updates the default to point to it. Opened automatically by the update-flix workflow." \
            2>pr_create_error.log; then
            exit 0
          fi

          cat pr_create_error.log >&2
          if grep -q "is not permitted to create or approve pull requests" pr_create_error.log; then
            echo "::error::GitHub Actions does not have permission to create pull requests in this repository. Enable it under Settings > Actions > General > Workflow permissions > \"Allow GitHub Actions to create and approve pull requests\", then re-run this workflow (branch '${branch}' has already been pushed)."
          else
            echo "::error::Failed to create a pull request for branch '${branch}'."
          fi
          exit 1
